name: OrbisActa v0.4.8 deployment version regression
on:
  push:
    branches: [fix/v048-deploy-version-verification]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - run: |
          python -m compileall -q publication_health.py
          python -m pytest -q tests/
