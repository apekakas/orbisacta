name: OrbisActa v0.4.3 archive and publication checks
on:
  push:
    branches: [feature/v043-archive-publication-monitor]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Check offline modules and tests
        run: |
          python -m compileall -q publication_health.py orbisacta.py international.py
          python -m pytest -q tests/
