name: OrbisActa v0.5.5 readability metrics
on:
  push:
    branches: [feature/v055-readability-visibility]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Reader readability indicators and existing regressions
        run: |
          python -m compileall -q quality_metrics.py hungarian_language.py
          python -m pytest -q tests/
