name: OrbisActa v0.4.2 source expansion tests
on:
  push:
    branches: [feature/v042-eu-press-source]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Python dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Offline regression suite
        run: |
          python -m compileall -q orbisacta.py quality_capacity.py
          python -m pytest -q tests/
