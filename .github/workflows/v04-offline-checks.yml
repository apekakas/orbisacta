name: OrbisActa v0.4 offline quality checks
on:
  push:
    branches:
      - feature/v0.4-quality-100-daily
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Compile modules and run offline tests
        run: |
          python -m compileall -q orbisacta.py quality_capacity.py
          python -m pytest -q tests/
