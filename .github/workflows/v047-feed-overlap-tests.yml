name: OrbisActa v0.4.7 RSS overlap checks
on:
  push:
    branches: [feature/v047-feed-throughput-audit]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - run: |
          python -m compileall -q orbisacta.py feed_overlap.py pending_diagnostics.py
          python -m pytest -q tests/
