name: OrbisActa v0.4.1 offline quality checks
on:
  push:
    branches: [feature/v041-publication-healthcheck]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Compile healthchecker and run offline test suite
        run: |
          python -m compileall -q publication_health.py orbisacta.py
          python -m pytest -q tests/
