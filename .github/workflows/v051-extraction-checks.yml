name: OrbisActa v0.5.1 article extraction recovery
on:
  push:
    branches: [feature/v051-extraction-recovery]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Test existing and recovery regressions
        run: |
          python -m compileall -q orbisacta.py
          python -m pytest -q tests/
