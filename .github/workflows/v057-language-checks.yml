name: OrbisActa v0.5.7 Hungarian mistranslation QA
on:
  push:
    branches: [feature/v057-language-defect-guard]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Source-faithful Hungarian language QA and full regression suite
        run: |
          python -m compileall -q orbisacta.py hungarian_language.py
          python -m pytest -q tests/
