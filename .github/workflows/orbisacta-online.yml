name: OrbisActa online hírfeldolgozás és publikálás

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC idő; Magyarországon télen +1, nyáron +2 óra.
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: read
  pages: read

concurrency:
  group: orbisacta-pages
  cancel-in-progress: false

jobs:
  news:
    name: Gyűjtés, AI, ellenőrzés és weboldalcsomag
    runs-on: ubuntu-latest
    outputs:
      expected_updated: ${{ steps.capture_version.outputs.expected_updated }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Python függőségek
        run: python -m pip install -r requirements.txt
      - name: Tesztfuttató telepítése
        run: python -m pip install "pytest>=8,<10"
      - name: Kódtesztek (nincs API-díj)
        run: python -m pytest -q tests/
      - name: Minőségpanel JavaScript szintaktikai ellenőrzése
        run: node --check docs/assets/quality-dashboard.js
      - name: Adatbázis visszatöltése a korábbi futásból
        uses: actions/cache@v4
        with:
          path: data/orbisacta.sqlite3
          key: orbisacta-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            orbisacta-sqlite-
      - name: Hírek gyűjtése és feldolgozása
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          ORBIS_APPROVED_MAX_AI_PER_RUN: "40"
        run: python orbisacta.py run --limit-per-feed 12 --max-ai 40 --daily-target 100 --max-translations 25
      - name: AI összefoglalások hibadiagnosztikája
        run: python diagnostics.py
      - name: Nem publikus adatfájlok ellenőrzése
        run: |
          test -f docs/index.html
          test -f docs/news.json
          test -f docs/site-status.json
          test -f docs/quality.json
          test ! -e docs/internal-preview.json
      - name: Publikációs adatok frissességének ellenőrzése
        run: python publication_health.py local --folder docs
      - name: Elkészült weboldal verziójának rögzítése
        id: capture_version
        run: |
          echo "expected_updated=$(python -c 'import json; print(json.load(open("docs/site-status.json", encoding="utf-8"))["updated_utc"])')" >> "$GITHUB_OUTPUT"
      - name: GitHub Pages előkészítés
        uses: actions/configure-pages@v5
      - name: Publikálandó oldal feltöltése
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publish:
    name: Nyilvános weboldal frissítése
    needs: news
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Publikálás GitHub Pagesre
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Éles publikáció visszaellenőrzése
        run: python publication_health.py remote --base "${{ steps.deployment.outputs.page_url }}" --expected-updated "${{ needs.news.outputs.expected_updated }}" --retries 8
