name: OrbisActa v0.5.8 five-language translation QA
on:
  push:
    branches: [feature/v058-multilingual-translation-qa]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: All five language QA regressions and prior tests
        run: |
          python -m compileall -q international.py multilingual_quality.py diagnostics.py
          python -m pytest -q tests/
