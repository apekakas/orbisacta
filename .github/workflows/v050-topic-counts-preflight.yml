name: OrbisActa v0.5.0 topic counts and preflight diagnostics
on:
  push:
    branches: [feature/v050-topic-counts-preflight]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Check all six localizations and offline suite
        run: |
          python -m compileall -q orbisacta.py
          python -m pytest -q tests/
