name: OrbisActa v0.6.0 expanded fresh RSS intake
on:
  push:
    branches: [feature/v060-expand-live-intake]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Expanded intake and all existing tests
        run: python -m pytest -q tests/
