name: OrbisActa v0.4.5 feed freshness tests
on:
  push:
    branches: [feature/v045-feed-freshness]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Test date handling and feed freshness
        run: |
          python -m compileall -q orbisacta.py feed_freshness.py pending_diagnostics.py
          python -m pytest -q tests/
